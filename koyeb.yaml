# Koyeb configuration for Telegram File Bot

name: telegram-file-bot

service:
  name: telegram-file-bot
  type: web
  ports:
    - port: 5000
      protocol: http
  routes:
    - path: /
      port: 5000
  env:
    - name: TELEGRAM_BOT_TOKEN
      value: "7860223453:AAHAdcM_1Fdi6cewSjeXAZSqofQg5K2FVWc"
      secret: true
  build:
    builder: dockerfile
    buildpacks:
      - name: python
  resources:
    cpu: 0.25
    memory: 512M
  scaling:
    min: 1
    max: 1
  healthcheck:
    port: 5000
    path: /
    initial_delay: 30s
    timeout: 10s
    period: 30s
    success_threshold: 1
    failure_threshold: 3